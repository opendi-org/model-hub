# Client authentication rules for the db service.
#
# compose.prod.yaml mounts this, and uses the -c flag
# (described here https://www.postgresql.org/docs/current/app-postgres.html)
# to specify it as the custom host-based authentication file on server startup.
# (see https://www.postgresql.org/docs/current/runtime-config-file-locations.html)
#
# Mounting directly to postgres's default pg_hba.conf location doesn't work. It
# gets automatically overwritten when the container initializes the db.
#
# Trimmed down from the image's default template to just what this project
# actually uses. See https://www.postgresql.org/docs/current/auth-pg-hba-conf.html
# for an example HBA file.


# Unix-domain socket connections - used by the pg_isready healthcheck and
# local psql debugging sessions. Never reachable from the network, so SSL
# doesn't apply.
#
# TYPE     DATABASE  USER  ADDRESS      METHOD
local      all       all                trust

# TCP connections must use SSL - "hostssl", not "host". This actually
# enforces DB_SSL_MODE=require
#
# TYPE     DATABASE  USER  ADDRESS      METHOD
hostssl    all       all   all          scram-sha-256
