[build-system]
requires = ["uv_build >= 0.10.0, <0.11.0"]
build-backend = "uv_build"

[project]
name = "opendi"
version = "0.1.0"
description = "Cross-platform CLI for the OpenDI Model Hub"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "keyring>=25.0",
    "typer>=0.15.0",
]

[project.scripts]
opendi = "opendi.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
