services:
  web:
    build:
      context: ./frontend/model-hub/
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend/model-hub/src:/webapp/src

  api:
    build:
      context: ./api/
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOSTNAME: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      OPENDI_MODEL_HUB_ADDRESS: api
      OPENDI_MODEL_HUB_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID}
      GOOGLE_WEB_CLIENT_SECRET: ${GOOGLE_WEB_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
      GOOGLE_CLI_CLIENT_ID: ${GOOGLE_CLI_CLIENT_ID}
      DEV_MODE: true
    ports:
      - "8080:8080"
    volumes:
      - ./api:/app
    command: ["air", "-c", ".air.toml"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      db_data: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db_data:
